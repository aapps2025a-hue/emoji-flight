<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emoji Flight · Sign in</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#245e89,#081726 70%);color:#ecf7ff;font:16px system-ui;padding:24px}.card{width:min(460px,100%);background:#102e48;border:1px solid #477397;border-radius:24px;padding:36px;box-shadow:0 30px 100px #0006}.plane{font-size:64px}h1{margin:10px 0;font-size:32px}p{line-height:1.6;color:#bfd7e9}label{display:block;margin:18px 0 7px;font-weight:650}input,button{width:100%;padding:14px;font:inherit;border-radius:10px}input{background:#091e31;color:white;border:1px solid #65859d}button{border:0;background:#ffd06a;color:#182d3e;font-weight:750;cursor:pointer;margin-top:22px}.secondary{background:transparent;color:#bcdfff;border:1px solid #65859d;margin-top:12px}button:disabled{opacity:.5}#message{min-height:24px;color:#ffd99c;margin:14px 0 0}small{color:#aac5d8}</style>
<main class="card"><div class="plane">✈️</div><h1>Emoji Flight</h1><p>Your airline. Your adventure.<br>Sign in to pick up your saved collection.</p><form id="auth"><label for="username">Username</label><input id="username" autocomplete="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_-]+"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="10" maxlength="128"><button id="submit">Sign in & play</button><button class="secondary" id="toggle" type="button">New pilot? Create an account</button><p id="message" role="status" aria-live="polite"></p></form><p><small>New pilots start with 500 coins and a free A320. Coins, purchases, supplies and airline designs save automatically. Flights restart at the terminal.</small></p></main>
<script src="./api.js"></script><script>let registering=false;const form=document.getElementById('auth'),message=document.getElementById('message');document.getElementById('toggle').onclick=()=>{registering=!registering;document.getElementById('submit').textContent=registering?'Create account & play':'Sign in & play';document.getElementById('toggle').textContent=registering?'Already a pilot? Sign in':'New pilot? Create an account';document.getElementById('password').autocomplete=registering?'new-password':'current-password';message.textContent=registering?'Choose a password with at least 10 characters.':''};form.onsubmit=async e=>{e.preventDefault();const buttons=form.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);message.textContent='Connecting…';try{const result=await window.flightRequest(registering?'/api/register':'/api/login',{method:'POST',headers:{'Content-Type':'application/json','X-Flight-App':'1'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});location.href='/game'}catch(e){message.textContent=e.message||'Cannot reach the server. Try again.'}finally{buttons.forEach(b=>b.disabled=false)}};
const authButtons=form.querySelectorAll('button');authButtons.forEach(b=>b.disabled=true);
message.textContent='Checking account server…';
window.flightRequest('/api/me').then(user=>{
 if(!Object.prototype.hasOwnProperty.call(user,'username'))throw Error('This server does not provide the Emoji Flight account API.');
 message.textContent='';authButtons.forEach(b=>b.disabled=false);
}).catch(error=>{message.textContent=error.message});
</script></html>
